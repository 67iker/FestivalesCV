
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FestivalesCV</title>
    <link rel="stylesheet" href="./assets/main.css">
    <link rel="stylesheet" href="./assets/popup.css">
    <link rel="stylesheet" href="./assets/eventos.css">
    <link rel="stylesheet" href="./assets/dashboard.css">
    <link rel="icon" type="image/x-icon" href="./assets/img/logo.png">
    <script src="./assets/js/popup_new.js" defer></script>
    <script src="./assets/js/popup_edit.js" defer></script>
    <script src="./assets/js/popup_detalling.js" defer></script>
    <script src="./assets/js/menu_grande.js" defer></script>
    <style>
        .edit-event::backdrop {
            background: rgba(0, 0, 0, 0.5);
        }
        /* Ocultar los diálogos cuando están cerrados */
        dialog#new-event:not([open]),
        dialog#edit-event:not([open]),
        dialog#detalling-event:not([open]) {
            display: none;
        }

        /* Asegúrate de tener también la clase que bloquea el scroll */
        body.no-scroll {
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="app">

        <aside class="sidebar" id="sidebar">
            <!-- Aquí se cargará el menú lateral -->
        </aside>

        <main class="main" id="main">
            <!-- Aquí se cargará cada página -->
        </main>

    </div>

    <!-- NUEVO EVENTO POP-UP -->
    <dialog class="event-new-modal" id="new-event">

        <h3 class="page-title">Nuevo Evento</h3>

        <div class="event-image nueva">
            <img src="./assets/img/icon_nube.png" alt="icon_nube">
            <a href="#">Click para subir archivo</a>
        </div>

        <input class="name" type="text" name="name" value="Introduce el nombre">

        <div class="event-info">
            <div>
                <strong>Dirección:</strong>
                <input type="text" name="direccion">
            </div>

            <div>
                <strong>Fechas:</strong>
                <input type="text" name="direccion">
            </div>

            <div>
                <strong>Estado:</strong>
                <select name="estado">
                    <option value="pendiente">Pendiente</option>
                    <option value="confirmado" selected>Confirmado</option>
                    <option value="cancelado">Cancelado</option>
                </select> 
            </div>

            <div>
                <strong>Cliente:</strong>
                <input type="text" name="direccion">
            </div>
        </div>

        <div class="actions">
            <button class="action-button btn-editar">Guardar</button>
            <button id="cerrar_new" class="action-button">Cerrar</button>
        </div>

    </dialog>

    <!-- EDITAR POP-UP -->
    <dialog class="event-edit-modal" id="edit-event">

        <h3 class="page-title">Editar Evento</h3>

        <div class="event-image medusa"></div>

        <input class="name" type="text" name="name" value="Medusa Sunbeach Festival">

        <div class="event-info">
            <div>
                <strong>Dirección:</strong>
                <input type="text" name="direccion" value="Plaça Numero 23, Cullera, Valencia">
            </div>

            <div>
                <strong>Fechas:</strong>
                <input type="text" name="direccion" value="12-16 ago">
            </div>

            <div>
                <strong>Estado:</strong>
                <select name="estado">
                    <option value="pendiente">Pendiente</option>
                    <option value="confirmado" selected>Confirmado</option>
                    <option value="cancelado">Cancelado</option>
                </select> 
            </div>

            <div>
                <strong>Cliente:</strong>
                <input type="text" name="direccion" value="PASSWORD 33, AIE">
            </div>
        </div>

        <div class="actions">
            <button class="action-button btn-editar">Guardar</button>
            <button id="cerrar_edit" class="action-button">Cerrar</button>
        </div>

    </dialog>

    <!-- Detalles POP-UP -->
    <dialog class="detalling-modal" id="detalling-event">

        <h3 class="page-title">Detalles del evento</h3>

        <!-- Buscador -->
        <div class="search-container">
            <input type="text" placeholder="Buscar festival" aria-label="Buscar festival">

            <button class="search-button" aria-label="Buscar">
                <img src="./assets/img/icon_buscar.png" alt="icon_buscar">
            </button>
        </div>

        <input class="name" type="text" name="name" value="Medusa Sunbeach Festival">

        <div class="event-info">
            <div>
                <strong>Dirección:</strong>
                <input type="text" name="direccion" value="Plaça Numero 23, Cullera, Valencia">
            </div>

            <div>
                <strong>Fechas:</strong>
                <input type="text" name="direccion" value="12-16 ago">
            </div>

            <div>
                <strong>Estado:</strong>
                <select name="estado">
                    <option value="pendiente">Pendiente</option>
                    <option value="confirmado" selected>Confirmado</option>
                    <option value="cancelado">Cancelado</option>
                </select> 
            </div>

            <div>
                <strong>Cliente:</strong>
                <input type="text" name="direccion" value="PASSWORD 33, AIE">
            </div>
        </div>

        <div class="actions">
            <button id="cerrar_detalling" class="action-button">Cerrar</button>
        </div>

    </dialog>

    <script src="./assets/js/app.js"></script>
</body>
</html>
